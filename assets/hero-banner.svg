<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="Abrar Junaed - Full-Stack Software Engineer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b2e" />
      <stop offset="100%" stop-color="#1a1635" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7aa2f7" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#292e42" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7aa2f7" />
      <stop offset="50%" stop-color="#2ac3de" />
      <stop offset="100%" stop-color="#bb9af7" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="82%" cy="18%" r="42%">
      <stop offset="0%" stop-color="#2ac3de" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#2ac3de" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowViolet" cx="15%" cy="88%" r="45%">
      <stop offset="0%" stop-color="#bb9af7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#bb9af7" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#7aa2f7" stroke-width="0.7" stroke-opacity="0.06" />
    </pattern>

    <clipPath id="cardClip">
      <rect x="2" y="2" width="1196" height="316" rx="18" />
    </clipPath>
  </defs>

  <!-- Card Base -->
  <g clip-path="url(#cardClip)">
    <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#bgGrad)" />
    <rect x="2" y="2" width="1196" height="316" fill="url(#grid)" />
    <rect x="2" y="2" width="1196" height="316" fill="url(#glowCyan)" />
    <rect x="2" y="2" width="1196" height="316" fill="url(#glowViolet)" />

    <!-- Top Accent Line -->
    <rect x="0" y="2" width="1200" height="3" fill="url(#accentGrad)" />
  </g>

  <!-- Card Border -->
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Status Pill -->
  <g transform="translate(60, 44)">
    <rect x="0" y="0" width="356" height="28" rx="14" fill="#1a2236" stroke="#2ac3de" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="16" cy="14" r="4.5" fill="#9ece6a">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite" />
    </circle>
    <text x="30" y="18.5" fill="#c0caf5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.8">
      OPEN TO COLLABORATION &amp; SOFTWARE ROLES
    </text>
  </g>

  <!-- Name & Gradient Accent -->
  <text x="60" y="134" fill="#f8fafc" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.5">
    Abrar Junaed
  </text>
  <rect x="60" y="148" width="140" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Primary Engineering Subtitle -->
  <text x="60" y="184" fill="#c0caf5" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="19.5" font-weight="600">
    Full-Stack Software Engineer  ·  Backend Architecture  ·  Applied AI &amp; 3D Web
  </text>

  <!-- Academic & Location Line -->
  <text x="60" y="216" fill="#7aa2f7" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500">
    B.Sc. in Computer Science &amp; Engineering @ United International University (UIU)  ·  Dhaka, BD
  </text>

  <!-- Tech Stack Chips Row -->
  <g transform="translate(60, 244)" font-family="Consolas, 'Fira Code', 'JetBrains Mono', monospace" font-size="12" font-weight="600">
    <g transform="translate(0, 0)">
      <rect width="92" height="26" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1" />
      <text x="46" y="17" fill="#7aa2f7" text-anchor="middle">TypeScript</text>
    </g>
    <g transform="translate(102, 0)">
      <rect width="92" height="26" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1" />
      <text x="46" y="17" fill="#2ac3de" text-anchor="middle">Next.js 16</text>
    </g>
    <g transform="translate(204, 0)">
      <rect width="108" height="26" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1" />
      <text x="54" y="17" fill="#9ece6a" text-anchor="middle">Spring Boot 3</text>
    </g>
    <g transform="translate(322, 0)">
      <rect width="74" height="26" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1" />
      <text x="37" y="17" fill="#f7768e" text-anchor="middle">NestJS</text>
    </g>
    <g transform="translate(406, 0)">
      <rect width="84" height="26" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1" />
      <text x="42" y="17" fill="#bb9af7" text-anchor="middle">Three.js</text>
    </g>
    <g transform="translate(500, 0)">
      <rect width="92" height="26" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1" />
      <text x="46" y="17" fill="#e0af68" text-anchor="middle">Gemini AI</text>
    </g>
    <g transform="translate(602, 0)">
      <rect width="94" height="26" rx="6" fill="#1f2335" stroke="#3b4261" stroke-width="1" />
      <text x="47" y="17" fill="#7dcfff" text-anchor="middle">PostgreSQL</text>
    </g>
  </g>

  <!-- Right Floating Code Terminal -->
  <g transform="translate(790, 42)">
    <rect x="0" y="0" width="356" height="236" rx="12" fill="#131622" stroke="#2f3549" stroke-width="1.2" />
    <rect x="0" y="0" width="356" height="34" rx="12" fill="#1a1e2e" />
    <rect x="0" y="22" width="356" height="12" fill="#1a1e2e" />
    <line x1="0" y1="34" x2="356" y2="34" stroke="#292e42" stroke-width="1" />

    <!-- Window Controls -->
    <circle cx="18" cy="17" r="5" fill="#f7768e" />
    <circle cx="34" cy="17" r="5" fill="#e0af68" />
    <circle cx="50" cy="17" r="5" fill="#9ece6a" />
    <text x="178" y="21" fill="#565f89" font-family="Consolas, 'Fira Code', monospace" font-size="11.5" text-anchor="middle">
      abrar@uiu:~/profile.ts
    </text>

    <!-- Code Content -->
    <g transform="translate(20, 58)" font-family="Consolas, 'Fira Code', 'JetBrains Mono', monospace" font-size="12.8">
      <text x="0" y="0">
        <tspan fill="#bb9af7">const</tspan>
        <tspan fill="#7aa2f7"> engineer</tspan>
        <tspan fill="#89ddff"> = </tspan>
        <tspan fill="#c0caf5">{</tspan>
      </text>
      <text x="0" y="24">
        <tspan fill="#7dcfff">  role</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#9ece6a">"Full-Stack &amp; AI"</tspan><tspan fill="#565f89">,</tspan>
      </text>
      <text x="0" y="48">
        <tspan fill="#7dcfff">  web</tspan><tspan fill="#89ddff">:  </tspan><tspan fill="#c0caf5">[</tspan><tspan fill="#9ece6a">"Next.js"</tspan><tspan fill="#565f89">, </tspan><tspan fill="#9ece6a">"React 19"</tspan><tspan fill="#c0caf5">]</tspan><tspan fill="#565f89">,</tspan>
      </text>
      <text x="0" y="72">
        <tspan fill="#7dcfff">  api</tspan><tspan fill="#89ddff">:  </tspan><tspan fill="#c0caf5">[</tspan><tspan fill="#9ece6a">"Spring"</tspan><tspan fill="#565f89">, </tspan><tspan fill="#9ece6a">"NestJS"</tspan><tspan fill="#c0caf5">]</tspan><tspan fill="#565f89">,</tspan>
      </text>
      <text x="0" y="96">
        <tspan fill="#7dcfff">  ai</tspan><tspan fill="#89ddff">:   </tspan><tspan fill="#c0caf5">[</tspan><tspan fill="#9ece6a">"Gemini"</tspan><tspan fill="#565f89">, </tspan><tspan fill="#9ece6a">"OpenCV"</tspan><tspan fill="#c0caf5">]</tspan><tspan fill="#565f89">,</tspan>
      </text>
      <text x="0" y="120">
        <tspan fill="#7dcfff">  gfx</tspan><tspan fill="#89ddff">:  </tspan><tspan fill="#9ece6a">"Three.js / R3F"</tspan><tspan fill="#565f89">,</tspan>
      </text>
      <text x="0" y="144">
        <tspan fill="#7dcfff">  ship</tspan><tspan fill="#89ddff">: </tspan><tspan fill="#ff9e64">true</tspan>
      </text>
      <text x="0" y="166">
        <tspan fill="#c0caf5">};</tspan>
      </text>
      <rect x="20" y="154" width="7.5" height="14" fill="#7aa2f7">
        <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
